<script id="mirror-math">/* Pure numerical core. Coordinates: millimetres, +X right, +Y up.
   Turns: positive clockwise, viewed directly at the screw head. */
const MirrorMath = (() => {
  const finite = Number.isFinite;
  function vector(before, after, turns) {
    if (![before.x,before.y,after.x,after.y,turns].every(finite) || Math.abs(turns)<0.0001) throw Error('Enter a nonzero, signed turn amount.');
    const v = {x:(after.x-before.x)/turns,y:(after.y-before.y)/turns};
    if (Math.hypot(after.x-before.x,after.y-before.y)<0.02) throw Error('The measured movement is under 0.02 mm. Repeat with a clearly measurable change.');
    return v;
  }
  function solve(columns, error, gain, maxTurn) {
    if (!columns.length || ![error.x,error.y,gain,maxTurn].every(finite) || gain<=0 || gain>1 || maxTurn<=0) throw Error('Check the selected screws and correction settings.');
    if (columns.some(v=>![v.x,v.y].every(finite) || Math.hypot(v.x,v.y)<1e-8)) throw Error('Calibrate each enabled screw first.');
    let a=0,b=0,d=0;
    columns.forEach(v=>{a+=v.x*v.x;b+=v.x*v.y;d+=v.y*v.y;});
    const trace=a+d, delta=Math.hypot(a-d,2*b), l1=(trace+delta)/2, l2=Math.max(0,(trace-delta)/2);
    const angle=0.5*Math.atan2(2*b,a-d), c=Math.cos(angle), s=Math.sin(angle);
    const p1=c*error.x+s*error.y, p2=-s*error.x+c*error.y;
    const fullRank=l2/l1>0.0001;
    const q1=p1/l1, q2=fullRank?p2/l2:0;
    const wx=c*q1-s*q2, wy=s*q1+c*q2;
    let turns=columns.map(v=>gain*(v.x*wx+v.y*wy));
    const peak=Math.max(...turns.map(Math.abs)), scale=peak>maxTurn?maxTurn/peak:1;
    const displayCap=Math.floor(maxTurn*10000+1e-9)/10000;
    turns=turns.map(t=>Math.sign(t)*Math.min(Math.abs(Math.round(t*scale*10000)/10000),displayCap));
    const movement=columns.reduce((m,v,i)=>({x:m.x+v.x*turns[i],y:m.y+v.y*turns[i]}),{x:0,y:0});
    const unreachable=Math.hypot(error.x-(c*p1),error.y-(s*p1));
    return {turns,movement,fullRank,limited:scale<1,unreachable:fullRank?0:unreachable,condition:fullRank?Math.sqrt(l1/l2):Infinity};
  }
  return {vector,solve};
})();
</script>

let state=fresh();try{const saved=localStorage.getItem(KEY);if(saved)state=validate(JSON.parse(saved));}catch(e){storageOK=false;}

function save(){try{localStorage.setItem(KEY,JSON.stringify(packet()));storageOK=true;}catch{storageOK=false;}updateSaveStatus();}
function updateSaveStatus(){const el=$('#save-status');if(el)el.textContent=storageOK?'Saved on this browser':'Use Export to keep your session';}
function toast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.remove('hidden');toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),4500);}
function goto(view){state.view=view;save();render();window.scrollTo({top:0,behavior:'instant'});$('#page-title')?.focus({preventScroll:true});}
function record(e){state.history.push({id:uid(),time:now(),...e});return state.history.at(-1);}
function hasLayout(){return state.present.length===3;}
function calibrated(){return active().length>0&&active().every(id=>state.cal[id]);}
function alignmentEvents(){return state.history.slice(state.history.findLastIndex(e=>e.reset)+1);}
function pendingRecord(){return state.history.find(e=>e.id===state.pending);}
function pageTop(kicker,title,subtitle,index){return `<div class="page-top"><div><div class="eyebrow">${kicker}</div><h1 id="page-title" tabindex="-1">${title}</h1><p>${subtitle}</p></div><div class="step-tag">STEP ${index} / 04</div></div>`;}

 class="hint">Select the three corners on your mount.</p>'}</div></section><section class="panel"><div class="panel-head"><h2>Session & target</h2><span>MM</span></div><div class="panel-body"><div class="fields"><label class="field-full">Session name<input id="name" value="${esc(state.name)}" maxlength="100"></label><label class="field-full">Target position / setup notes<input id="context" value="${esc(state.context)}" maxlength="180"></label><label>Circle diameter (mm)<input id="diameter" type="number" value="${state.diameter}" min="1" max="1000" step=".1"></label><label>Center tolerance (mm)<input id="tolerance" type="number" value="${state.tolerance}" min=".01" max="100" step=".01"></label></div><p class="hint" style="margin-top:15px">Use the diameter of the target opening you are plotting against, not the size of the burn mark.</p></div></section><div class="note">Start with two enabled adjusters and hold the third screw fixed, especially if it serves as the pivot. Enable the third only if your mount permits it.</div></div></div><div class="next-action"><p class="hint">${hasLayout()?'Three points support the mirror. Next: learn the movement.':'Select exactly three physical screw positions to continue.'}</p><button class="primary" data-view="calibrate" ${!hasLayout()?'disabled':''}>Calibrate movement →</button></div>`;}

 const adjustments=state.history.filter(e=>e.kind==='adjustment'&&e.after),measurements=alignmentEvents().flatMap(e=>e.kind==='measurement'?[e.point]:e.kind==='adjustment'&&e.after?[e.after]:[]),latest=measurements.at(-1);
 let chart='';if(measurements.length){const max=Math.max(...measurements.map(dist),state.tolerance*2,.1),n=measurements.length;const x=i=>30+(n===1?0:i/(n-1)*440),y=v=>135-v/max*105;chart=`<svg class="history-chart" viewBox="0 0 500 160" role="img" aria-label="Distance from center over ${n} measured hits"><line x1="30" y1="${y(state.tolerance)}" x2="470" y2="${y(state.tolerance)}" stroke="#789c73" stroke-dasharray="4 4"/><text x="32" y="${Math.max(15,y(state.tolerance)-7)}" fill="#9daf99" font-size="9" font-family="monospace">tolerance ${state.tolerance} mm</text><polyline fill="none" stroke="#ff995d" stroke-width="2" points="${measurements.map((p,i)=>`${x(i)},${y(dist(p))}`).join(' ')}"/>${measurements.map((p,i)=>`<circle cx="${x(i)}" cy="${y(dist(p))}" r="3" fill="#ff995d"/>`).join('')}<text x="30" y="155" fill="#96a28e" font-size="9">FIRST HIT</text><text x="420" y="155" fill="#96a28e" font-size="9">LATEST</text></svg>`;}
 return pageTop('04 / Session progression','Every turn tells a story.','Measured hits, calibration moves, and applied corrections stay together in this browser.',4)+`<div class="grid-two"><section class="panel"><div class="panel-head"><h2>Session log</h2><span>${state.history.length} RECORDS</span></div>${state.history.length?`<ol class="history-list">${state.history.slice().reverse().map(e=>historyItem(e)).join('')}</ol>`:'<div class="empty-state"><div class="progress-count">↗</div><h3>A clear record from the first hit</h3><p>Your calibration tests and alignment iterations will appear here automatically.</p><button class="small primary" data-view="calibrate">Start calibrating →</button></div>'}</section><div class="stack sticky"><section class="panel"><div class="panel-head"><h2>Distance from center</h2><span>CURRENT TARGET · MEASURED</span></div><div class="panel-body"><div class="metric-row"><div class="metric"><div class="eyebrow">Completed steps</div><div class="value">${adjustments.length}</div></div><div class="metric"><div class="eyebrow">Latest offset</div><div class="value">${latest?fmt(dist(latest)):'—'}<small>mm</small></div></div></div>${chart||'<p class="hint">The chart starts with your first saved alignment hit. Calibration moves are excluded.</p>'}</div></section><section class="panel"><div class="panel-head"><h2>Take your session with you</h2><span>LOCAL JSON</span></div><div class="panel-body"><p class="hint">Export includes the screw layout, measured responses, hit history, and any unfinished adjustment. Import it to resume on another browser.</p><div class="row wrap" style="margin-top:18px"><button class="primary small" data-action="export">↓ Export session</button><button class="ghost small" data-action="import">↑ Import</button></div><button class="ghost small" data-action="new" style="margin-top:12px;width:100%">＋ Start a new session</button></div></section><div class="note">Recalibrate if you change the mirror, target distance, viewing orientation, or mount mechanics. Old measurements remain in the log as a record.</div></div></div>`;
}
function historyItem(e){const time=new Date(e.time),date=Number.isNaN(time.getTime())?'Imported record':time.toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}),xy=p=>`X ${signed(p.x)} · Y ${signed(p.y)} mm`;
 let title='',body='',tag='';
 if(e.kind==='measurement'){title='Baseline hit saved';body=`${xy(e.point)} · ${fmt(dist(e.point))} mm from center`;tag='MEASURED';}
 if(e.kind==='calibration'){title=`Screw ${e.screw} response measured`;body=`${xy(e.before)} → ${xy(e.after)}<div class="turn-list">${signed(e.turns,4)} turns · ΔX ${signed(e.vector.x)} / ΔY ${signed(e.vector.y)} mm per CW turn</div>`;tag='CALIBRATION';}
 if(e.kind==='configuration'){title='Setup updated';body=esc(e.text);tag='SETUP';}
 if(e.kind==='adjustment'){title=e.after?'Correction measured':'Turns applied · awaiting hit';body=`${xy(e.before)}${e.after?` → ${xy(e.after)}`:''}<div class="turn-list">${e.turns.map(t=>`${t.id}: ${signed(t.value,4)} turn`).join(' &nbsp; / &nbsp; ')}</div>${e.after?`<p>Measured ${fmt(dist(e.after))} mm from center · predicted ${fmt(dist(e.predicted))} mm</p>`:'<p>Return to Align beam to record the result.</p>'}`;tag=e.after?'COMPLETED':'PENDING';}
 return `<li class="history-item"><div class="history-title"><strong>${title}</strong><span class="pill ${e.kind==='adjustment'&&!e.after?'orange':'gray'}">${tag}</span></div><div class="history-copy">${body}</div><div class="time" style="margin-top:10px">${esc(date)}</div></li>`;
}
function setPoint(mode,p,full=true){
 p={x:Math.round(p.x*1000)/1000,y:Math.round(p.y*1000)/1000};
 if(mode==='cal')state.calDraft=p;else{state.draft=p;state.proposal=null;}
 if(full){save();render();}else{const solution=$('#solution-container');if(solution&&!state.proposal)solution.innerHTML=solutionPanel();const calc=$('[data-action="calculate"]');if(calc)calc.disabled=!state.draft||!hasLayout()||!calibrated();const calNext=$('[data-action="cal-next"]');if(calNext)calNext.disabled=!state.calDraft||!hasLayout()||!!state.pending;const area=$('#plot-area');if(area)area.innerHTML=plotSvg(mode);const x=$('#point-x'),y=$('#point-y');if(x)x.value=fmt(p.x,3);if(y)y.value=fmt(p.y,3);}
}
function invalidate(text){state.cal={};state.calTask={screw:state.present[0]||'A',stage:0,before:null,turns:.0625};state.calDraft=null;state.proposal=null;state.current=null;state.draft=null;record({kind:'configuration',reset:true,text:text+' Calibration cleared; previous records retained.'});}
function calculate(){
 if(!state.draft||!calibrated()||!hasLayout())return;
 const p={...state.draft},pending=pendingRecord();
 if(pending){pending.after=p;state.pending=null;const actualMovement=Math.hypot(p.x-pending.before.x,p.y-pending.before.y),predMovement=Math.hypot(pending.predicted.x-pending.before.x,pending.predicted.y-pending.before.y);if(actualMovement<.02&&predMovement>.2)toast('Very little movement measured. Check screw identity, backlash, and calibration.');}
 else if(!alignmentEvents().some(e=>e.kind==='measurement'||e.kind==='adjustment')||!state.current||Math.hypot(state.current.x-p.x,state.current.y-p.y)>.00001)record({kind:'measurement',point:p});
 state.current=p;state.proposal=null;
 if(dist(p)<=state.tolerance){save();render();toast('Measured hit is within the center tolerance. Recheck near and far positions.');return;}
 try{const ids=active(),vectors=ids.map(id=>({...state.cal[id]})),r=MirrorMath.solve(vectors,{x:-p.x,y:-p.y},state.gain,state.maxTurn);state.proposal={ids,vectors,from:p,...r,predicted:{x:p.x+r.movement.x,y:p.y+r.movement.y}};save();render();if(r.turns.every(t=>Math.abs(t)<.00005))toast('No useful turn at this resolution. Check the enabled directions and your measurement tolerance.');}catch(e){save();render();toast(e.message);}
}
function applyTurns(){
 const p=state.proposal;if(!p)return;
 const turns=p.ids.map(id=>({id,value:Number($(`[data-actual="${id}"]`).value)}));
 if(turns.some(t=>!Number.isFinite(t.value)||Math.abs(t.value)>10)||turns.every(t=>Math.abs(t.value)<.00005)){toast('Enter actual signed turns; at least one must be nonzero.');return;}
 const predicted=turns.reduce((q,t,i)=>({x:q.x+p.vectors[i].x*t.value,y:q.y+p.vectors[i].y*t.value}),{...p.from});
 const entry=record({kind:'adjustment',before:{...p.from},predicted,turns,after:null});state.pending=entry.id;state.proposal=null;state.draft=null;state.current=null;save();render();toast('Applied turns saved. Plot the new observed hit.');
}
function calibrationNext(){
 if(!state.calDraft||state.pending)return;const t=state.calTask;
 if(t.stage===0){t.before={...state.calDraft};t.stage=1;state.calDraft=null;save();render();return;}
 const input=$('#cal-turns'),turns=Number(input.value);if(input.value.trim()===''||!Number.isFinite(turns)||Math.abs(turns)>.125||Math.abs(turns)<.0001){toast('Use a signed test turn between −0.125 and +0.125, excluding zero.');return;}
 try{const after={...state.calDraft},v=MirrorMath.vector(t.before,after,turns);state.cal[t.screw]={...v,at:now(),source:'measured'};record({kind:'calibration',screw:t.screw,before:{...t.before},after,turns,vector:v});state.current=after;state.draft=after;state.proposal=null;const next=active().find(id=>!state.cal[id])||t.screw;state.calTask={screw:next,stage:0,before:null,turns:.0625};state.calDraft=null;save();render();toast(`Screw ${t.screw} calibrated. ${calibrated()?'Ready to align.':'Continue with the next enabled screw.'}`);}catch(e){toast(e.message);}
}
function exportSession(){save();const blob=new Blob([JSON.stringify(packet(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mirrorline-'+state.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,50)+'-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Session exported. Keep the JSON file to resume later.');}
function closeModal(){const root=$('#modal-root');root.innerHTML='';modalReturn?.focus();modalReturn=null;}
function modal(title,html){modalReturn=document.activeElement;$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="panel-head"><h2 id="modal-title">${title}</h2><button class="ghost help-close" data-action="close-modal" aria-label="Close dialog">×</button></div><div class="panel-body">${html}</div></section></div>`;$('#modal-root button')?.focus();}
function help(){modal('The alignment field guide',`<h3>What this tool can calculate</h3><p>This is a mirror <strong>alignment</strong> aid. The focusing lens and workpiece height set optical focus. This page predicts how screw turns move a measured spot at one fixed target plane.</p><h3>Why the ball-supported mount needs calibration</h3><p>The mirror tilts about its supports. A screw can couple horizontal and vertical motion; the reflected spot also depends on target distance and viewing direction. Three screws provide more adjustment choices than the two coordinates of a single spot can uniquely determine.</p><p>We measure a response vector for each enabled screw: <span class="mono">(after − before) / signed turns</span>. The calculator finds the smallest combined turns that reduce the measured center error, using a least-squares solution. Held screws always receive zero turns. Three enabled screws use a minimum-norm solution; this does not impose a separate mirror-translation constraint.</p><p>Corner locations label your physical screws. They do not by themselves establish movement directions or turns. No guessed pitch, distance, or “universal” clockwise direction is used.</p><h3>A practical workflow</h3><ol style="color:var(--muted);padding-left:20px"><li>Choose the three occupied corners as viewed from the screw heads. Hold the pivot screw when appropriate for your mount.</li><li>Enter the target circle diameter. Keep the same camera/viewing orientation and target position throughout calibration and correction.</li><li>For each enabled screw, plot a start hit, make one small known signed turn, and plot the new hit. Leave the screw there. Only that screw may move during its test.</li><li>Plot the current hit in Align beam. Apply the suggested turns manually, record what you actually applied, then save a new measured hit. Repeat.</li><li>Use the machine’s complete alignment checks before use. Recheck after securing any locking nuts.</li></ol><h3>Near and far marks come first</h3><p>A centered spot at one location does not establish a parallel beam. For mirror-to-mirror travel alignment, compare hits with the receiving mirror near and far along its travel, following the manufacturer’s order. Repeat that comparison after adjustments because both marks can move. Recalibrate this tool when target distance changes.</p><p>Adjust the upstream mirror while observing its downstream target: for example, adjust Mirror 1 while marking hits at Mirror 2. Start a separate session for each mirror/target setup.</p><h3>Use small steps and verify</h3><p>The default moves 70% of the predicted correction and caps each step at ⅛ turn. Predictions assume small, repeatable motion. Backlash, spring preload, loose locks, coupled movement, or a changed setup can make the result differ. The history keeps actual measurements separate from predictions; the tool does not silently refit calibration from simultaneous turns.</p><h3>Laser safety</h3><p>Follow your machine’s approved procedure and specified eye protection. Keep guards and interlocks working. Disable firing before reaching in or adjusting screws. Use only the manufacturer-approved marking method and test settings. The tool never connects to or fires the machine.</p><h3>Research & sources</h3><ul><li><a href="https://www.newport.com/medias/sys_master/images/images/hbd/h75/8797225975838/Optical-Mounts-Ignore-Them-at-Your-Peril.pdf" target="_blank" rel="noopener noreferrer">Newport — Optical Mounts: Ignore Them at Your Peril</a>: kinematic supports, axis coupling, distance sensitivity, and reflected angle.</li><li><a href="https://help.omtechlaser.com/hc/en-us/articles/32755275789081-Laser-Engraver-Mirror-Alignment-How-to-Align-a-CO2-Laser-Beam" target="_blank" rel="noopener noreferrer">OMTech — CO₂ laser mirror alignment</a>: near/far repeatability, small adjustments, and machine safeguards.</li><li><a href="https://www.newport.com/p/M05-XL" target="_blank" rel="noopener noreferrer">Newport — three-actuator kinematic mount</a>: tip, tilt, and translation degrees of freedom.</li></ul><h3>Your data stays here</h3><p>There are no external libraries, remote requests, or accounts. Browser storage is best effort, especially when opening a local HTML file. Export a JSON backup to preserve your session across browsers, file moves, or cleared storage. Import replaces the current session.</p>`);}
const actions={'reset-cal':()=>{invalidate('Calibration reset for a changed setup.');save();render();toast('Calibration cleared. Measure each enabled screw again.');},help,export:exportSession,import:()=>$('#import-file').click(),'close-modal':closeModal,'calculate':calculate,'apply':applyTurns,'cal-next':calibrationNext,'cal-restart':()=>{state.calTask.stage=0;state.calTask.before=null;state.calDraft=null;save();render();},'clear-dot':()=>{state.draft=null;state.proposal=null;save();render();},new:()=>modal('Start a new session',`<p>Export the current session first if you want to keep it. Starting a new one clears the current browser workspace.</p><div class="row wrap" style="margin-top:22px"><button class="ghost" data-action="export">Export current session</button><button class="primary" data-action="confirm-new">Start fresh</button></div>`),'confirm-new':()=>{closeModal();state=fresh();save();render();toast('New session ready.');},'manual-cal':()=>{
 if(state.pending){toast('Finish the pending alignment measurement first.');return;}const id=$('#manual-screw').value,x=$('#manual-x'),y=$('#manual-y'),v={x:Number(x.value),y:Number(y.value)};
 if(!x.value.trim()||!y.value.trim()||!validPoint(v)||Math.hypot(v.x,v.y)<1e-8){toast('Enter both signed movement values. They cannot both be zero.');return;}
 state.cal[id]={...v,at:now(),source:'manual'};state.proposal=null;record({kind:'configuration',text:`Screw ${id} response entered manually: ΔX ${signed(v.x)} / ΔY ${signed(v.y)} mm per clockwise turn.`});save();render();toast(`Screw ${id} measured response saved.`);
}};
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.view){goto(b.dataset.view);return;}
 if(b.dataset.action){actions[b.dataset.action]?.();return;}
 if(b.dataset.corner){if(state.pending){toast('Finish measuring the pending adjustment before changing the mount.');return;}const id=b.dataset.corner;if(state.present.includes(id)){state.present=state.present.filter(v=>v!==id);state.enabled=state.enabled.filter(v=>v!==id);}else{if(state.present.length>=3){toast('Remove the empty corner first; a three-screw mount has three occupied corners.');return;}state.present.push(id);state.present.sort();state.enabled.push(id);}invalidate('Physical screw layout changed.');save();render();return;}
 if(b.dataset.calScrew){state.calTask={screw:b.dataset.calScrew,stage:0,before:null,turns:.0625};state.calDraft=null;save();render();}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='import-file')return importFile(el);
 if(el.dataset.enable){if(state.pending){el.checked=!el.checked;toast('Finish the pending measurement before changing enabled screws.');return;}const id=el.dataset.enable;state.enabled=el.checked?[...state.enabled,id]:state.enabled.filter(v=>v!==id);state.proposal=null;save();render();return;}
 if(el.dataset.coordinate){const x=$('#point-x').value,y=$('#point-y').value;if(x===''||y==='')return;const p={x:Number(x),y:Number(y)};if(!validPoint(p)){toast('Enter finite coordinates within ±1,000,000 mm.');return;}const needed=2*Math.max(Math.abs(p.x),Math.abs(p.y))/state.diameter*1.1;if(needed>state.zoom)state.zoom=needed<=3?3:needed<=6?6:20;setPoint(el.dataset.mode,p,false);save();return;}
 if(el.id==='context'&&state.pending){toast('Finish the pending measurement before changing the setup.');render();return;}
 if(['name','context'].includes(el.id)){const next=el.value.trim().slice(0,el.id==='name'?100:180);if(el.id==='context'&&next!==state.context){invalidate('Target setup / position notes changed.');toast('Setup changed. Recalibrate at the new target position.');}state[el.id]=next;if(!state.name)state.name='Untitled mirror';save();$('#session-name').textContent=state.name;$('#session-context').textContent=state.context;return;}
 if(['diameter','context'].includes(el.id)&&state.pending){toast('Finish the pending measurement before changing the setup.');render();return;}
 if(el.id==='diameter'){const v=Number(el.value);if(!Number.isFinite(v)||v<1||v>1000){toast('Circle diameter must be 1–1,000 mm.');render();return;}if(v!==state.diameter){state.diameter=v;invalidate('Target diameter / coordinate scale changed.');toast('Scale changed. Recalibrate the screw responses.');}save();render();return;}
 if(el.id==='tolerance'){const v=Number(el.value);if(!Number.isFinite(v)||v<.01||v>100){toast('Tolerance must be 0.01–100 mm.');render();return;}state.tolerance=v;state.proposal=null;save();render();return;}
 if(['gain','maxTurn','zoom'].includes(el.id)){state[el.id]=Number(el.value);if(el.id!=='zoom')state.proposal=null;save();render();return;}
 if(el.id==='cal-turns'){const v=Number(el.value);if(Number.isFinite(v))state.calTask.turns=v;save();return;}
 if(el.id==='manual-screw'){const v=state.cal[el.value];$('#manual-x').value=v?v.x:'';$('#manual-y').value=v?v.y:'';}
});
function pointerPoint(e){const svg=$('#target-plot');if(!svg)return;const rect=svg.getBoundingClientRect(),span=state.diameter*state.zoom;setPoint(svg.dataset.mode,{x:((e.clientX-rect.left)/rect.width-.5)*span,y:(.5-(e.clientY-rect.top)/rect.height)*span},false);}
document.addEventListener('pointerdown',e=>{if(e.target.closest('#target-plot')){e.preventDefault();drag=true;pointerPoint(e);}});
document.addEventListener('pointermove',e=>{if(drag)pointerPoint(e);});
document.addEventListener('pointerup',()=>{if(drag){drag=false;save();render();$('#target-plot')?.focus({preventScroll:true});}});
document.addEventListener('pointercancel',()=>{if(drag){drag=false;save();render();}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&$('#modal-root').children.length){closeModal();return;}
 const dialog=$('[role="dialog"]');if(dialog&&e.key==='Tab'){const els=Array.from(dialog.querySelectorAll('button,a,input,select')).filter(n=>!n.disabled),first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}return;}
 const svg=e.target.closest?.('#target-plot');if(!svg||!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const mode=svg.dataset.mode,p={...((mode==='cal'?state.calDraft:state.draft)||{x:0,y:0})},step=e.shiftKey?1:.1;p.x+=e.key==='ArrowRight'?step:e.key==='ArrowLeft'?-step:0;p.y+=e.key==='ArrowUp'?step:e.key==='ArrowDown'?-step:0;setPoint(mode,p);$('#target-plot')?.focus({preventScroll:true});
});
async function importFile(el){const file=el.files?.[0];el.value='';if(!file)return;try{if(file.size>5e6)throw Error('Session file is too large (maximum 5 MB).');const candidate=validate(JSON.parse(await file.text()));modal('Import this session?',`<p>Replace the current workspace with <strong>${esc(candidate.name)}</strong> (${candidate.history.length} records)? Export the current session first to keep a copy.</p><div class="row wrap" style="margin-top:20px"><button class="ghost" data-action="export">Export current</button><button class="primary" id="confirm-import">Import & resume</button></div>`);$('#confirm-import').addEventListener('click',()=>{closeModal();state=candidate;save();render();toast('Session imported. Continue where you left off.');});}catch(e){toast(e.message||'Could not read this session file.');}}
shell();render();if(!storageOK)toast('Browser storage is unavailable or the saved session could not be read. Export a backup during use.');
})();
